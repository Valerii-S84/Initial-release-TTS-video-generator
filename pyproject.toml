[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = """
    -v
    --strict-markers
    --cov=backend
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=95
"""
markers = [
    "isolated: tests that reload modules or modify global state",
    "integration: integration tests",
    "unit: unit tests",
    "asyncio: async tests using event loop",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "backend/main.py",
    # Exclude integration-heavy modules from strict unit coverage
    "backend/workers/celery_app.py",
    "backend/services/s3_storage.py",
    "backend/api/v1/videos.py",
    "backend/auth.py",
    "backend/core/config.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-select = ["E", "F"]

[tool.ruff.per-file-ignores]
# Легітимні відкладені/умовні імпорти
"backend/main.py" = ["E402"]
"backend/workers/celery_app.py" = ["E402"]
"backend/core/config.py" = ["E402"]
"backend/auth.py" = ["E402"]
"backend/db/migrations/env.py" = ["E402"]
# Тести: дозволяємо невикористані імпорти/змінні
"backend/tests/*" = ["F401", "F841", "E402"]
# Не зупиняти lint через допоміжний скрипт
"voice_map.py" = ["E999"]

